name: BTCUSD read-only readiness probe

on:
  push:
    branches: [main]
    paths:
      - "api/market-data-btc.js"
      - "api/analyze-btc.js"
      - ".github/workflows/btc-readiness-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-btc-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify authenticated fresh BTCUSD candles without generating a signal
        env:
          GOLD_SCALPER_URL: https://gold-scalper-nexora-apparel.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET repository secret is missing."
            exit 1
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --connect-timeout 8 --max-time 20 \
              --output "$response_file" --write-out '%{http_code}' \
              --header "Authorization: Bearer $CRON_SECRET" \
              "${GOLD_SCALPER_URL%/}/api/market-data-btc" || true)"
            if [ "$code" = "200" ]; then
              node --input-type=module - "$response_file" <<'NODE'
          import fs from "node:fs";
          let body;
          try {
            body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          } catch {
            console.error("BTC market-data route returned invalid JSON.");
            process.exit(1);
          }
          const summary = {
            ok: body.ok === true,
            symbol: body.symbol ?? null,
            interval: body.interval ?? null,
            candleCount: body.candleCount ?? 0,
            dataFreshness: body.dataFreshness ?? "unverified",
            latestCandleTime: body.latestCandleTime ?? null
          };
          console.log(JSON.stringify(summary));
          if (body.ok !== true || body.symbol !== "BTC/USD" ||
              Number(body.candleCount) < 80 || body.dataFreshness !== "verified") {
            console.error("BTC market-data verification failed. No signal was generated.");
            process.exit(1);
          }
          NODE
              exit $?
            fi
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "BTC market-data route authorization failed (HTTP $code)."
              exit 1
            fi
            echo "BTC route not ready or provider unavailable (HTTP ${code:-network-error}); retry $attempt/12."
            sleep 15
          done
          echo "BTC market-data endpoint did not return verified fresh candles after 12 attempts."
          exit 1
      - name: Verify read-only BTCUSD H1/M15 analysis and current quote
        env:
          GOLD_SCALPER_URL: https://gold-scalper-nexora-apparel.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
              --output "$response_file" --write-out '%{http_code}' \
              --request POST "${GOLD_SCALPER_URL%/}/api/diagnose-btc" \
              --header "Authorization: Bearer $CRON_SECRET" \
              --header "Content-Type: application/json" \
              --data '{"diagnostic":true}' || true)"
            if [ "$code" = "200" ]; then
              node --input-type=module - "$response_file" <<'NODE'
          import fs from "node:fs";
          let body;
          try {
            body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          } catch {
            console.error("BTC diagnostic returned invalid JSON.");
            process.exit(1);
          }
          const summary = {
            ok: body.ok === true,
            diagnosticOnly: body.diagnosticOnly === true,
            symbol: body.symbol ?? null,
            h1CandleCount: body.h1CandleCount ?? 0,
            m15CandleCount: body.m15CandleCount ?? 0,
            dataFreshness: body.dataFreshness ?? "unverified",
            livePriceVerified: body.livePriceVerified === true,
            analysisStatus: body.analysisStatus ?? null,
            candidateSuppressed: body.candidateSuppressed === true,
            telegramSent: body.telegramSent === true,
            databaseWrites: body.databaseWrites === true,
            brokerExecution: body.brokerExecution === true
          };
          console.log(JSON.stringify(summary));
          if (body.ok !== true || body.diagnosticOnly !== true || body.symbol !== "BTC/USD" ||
              Number(body.h1CandleCount) < 60 || Number(body.m15CandleCount) < 80 ||
              body.dataFreshness !== "verified" || body.livePriceVerified !== true ||
              body.signal !== null || body.telegramSent !== false ||
              body.databaseWrites !== false || body.brokerExecution !== false) {
            console.error("Read-only BTC diagnostic failed validation; no signal was generated.");
            process.exit(1);
          }
          NODE
              exit $?
            fi
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "BTC diagnostic authorization failed (HTTP $code)."
              exit 1
            fi
            echo "BTC diagnostic route not ready or provider unavailable (HTTP ${code:-network-error}); retry $attempt/12."
            sleep 15
          done
          echo "Read-only BTC diagnostic did not verify fresh H1/M15 data and current quote after 12 attempts."
          cat "$response_file"
          exit 1
      - name: Verify Telegram delivery with a one-time non-trade message
        env:
          GOLD_SCALPER_URL: https://gold-scalper-nexora-apparel.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --connect-timeout 8 --max-time 30 \
              --output "$response_file" --write-out '%{http_code}' \
              --request POST "${GOLD_SCALPER_URL%/}/api/diagnose-btc" \
              --header "Authorization: Bearer $CRON_SECRET" \
              --header "Content-Type: application/json" \
              --data '{"diagnostic":true,"mode":"telegram"}' || true)"
            if [ "$code" = "200" ]; then
              node --input-type=module - "$response_file" <<'NODE'
          import fs from "node:fs";
          let body;
          try {
            body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          } catch {
            console.error("BTC Telegram diagnostic returned invalid JSON.");
            process.exit(1);
          }
          const summary = {
            ok: body.ok === true,
            messageSent: body.messageSent === true,
            alreadySent: body.alreadySent === true,
            note: body.note ?? null
          };
          console.log(JSON.stringify(summary));
          if (body.ok !== true || !(body.messageSent === true || body.alreadySent === true)) {
            console.error("BTC Telegram delivery was not verified.");
            process.exit(1);
          }
          NODE
              exit $?
            fi
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "BTC Telegram diagnostic authorization failed (HTTP $code)."
              exit 1
            fi
            echo "BTC Telegram diagnostic route not ready or delivery unavailable (HTTP ${code:-network-error}); retry $attempt/12."
            sleep 15
          done
          echo "BTC Telegram diagnostic did not complete after 12 attempts."
          cat "$response_file"
          exit 1
