name: VELTRIX LIVE Android Build
on:
  push:
    branches:
      - veltrix-live-final-validation
    paths:
      - "android/**"
      - ".github/workflows/veltrix-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile, test and assemble
        run: |
          gradle -p android testDebugUnitTest assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-live-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
