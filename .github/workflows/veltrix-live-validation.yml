name: VELTRIX LIVE validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [veltrix-live-rebuild]
    paths:
      - "lib/**"
      - "api/**"
      - "tests/**"
      - "android/**"
      - "package.json"
      - "index.html"
      - ".github/workflows/veltrix-live-validation.yml"

permissions:
  contents: read

jobs:
  web-and-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run check

  android-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle -p android assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: veltrix-live-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
