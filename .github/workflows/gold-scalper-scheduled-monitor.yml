name: Gold Scalper scheduled monitor
# Uses the stable Production domain; Preview deployments remain SSO-protected.

on:
  # Live analysis must not run automatically on every code push.
  # Keep schedule as a temporary fallback until external dispatch is verified.
  schedule:
    # GitHub scheduled workflows can be delayed; this is not tick-level monitoring.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-scalper-scheduled-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate scheduler configuration
        env:
          GOLD_SCALPER_URL: https://gold-scalper-nexora-apparel.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          test -n "$GOLD_SCALPER_URL" || { echo "Missing GOLD_SCALPER_URL configuration"; exit 1; }
          test -n "$CRON_SECRET" || { echo "Missing repository secret CRON_SECRET"; exit 1; }
          case "$GOLD_SCALPER_URL" in
            https://*) ;;
            *) echo "GOLD_SCALPER_URL must use HTTPS"; exit 1 ;;
          esac
          case "$GOLD_SCALPER_URL" in
            */api/*) echo "GOLD_SCALPER_URL must be the base deployment URL, without an API path"; exit 1 ;;
          esac

      - name: Verify deployed prerequisites
        id: preflight
        env:
          GOLD_SCALPER_URL: https://gold-scalper-nexora-apparel.vercel.app
        run: |
          set -eu
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          code="$(curl --silent --show-error --connect-timeout 8 --max-time 20 --retry 2 --retry-delay 2 --retry-connrefused \
            --output "$response_file" --write-out '%{http_code}' \
            "${GOLD_SCALPER_URL%/}/api/status")"
          test "$code" -ge 200 && test "$code" -lt 300 || {
            echo "Status endpoint failed with HTTP $code"
            exit 1
          }
          node --input-type=module - "$response_file" <<'NODE'
          import fs from "node:fs";
          let status;
          try {
            status = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          } catch {
            console.error("Status endpoint returned invalid JSON.");
            process.exit(1);
          }
          const checks = {
            application: status.application === "ONLINE",
            database: status.database === "CONNECTED",
            marketDataKey: status.marketKeyConfigured === true,
            telegram: status.telegramConfigured === true,
            cronSecret: status.cronSecretConfigured === true,
          };
          console.log(JSON.stringify({ prerequisiteChecks: checks, engine: status.engine, emergencyStop: status.emergencyStop }));
          const failed = Object.entries(checks).filter(([, ok]) => !ok).map(([name]) => name);
          if (failed.length) {
            console.error("Prerequisite check(s) failed: " + failed.join(", "));
            process.exit(1);
          }
          const skipForPause = status.emergencyStop === true || status.engine !== "RUNNING";
          const goldShouldRun = status.goldEnabled !== false &&
            (status.goldSessionActive === true || status.goldActiveSignalNeedsMonitoring === true);
          const btcShouldRun = status.btcEnabled === true || status.btcActiveSignalNeedsMonitoring === true;
          if (skipForPause || (!goldShouldRun && !btcShouldRun)) {
            console.log(skipForPause
              ? "Monitor skipped because the engine is intentionally paused or emergency-stopped."
              : "Monitor skipped: no enabled market is due for analysis.");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "should_run=false\n");
            process.exit(0);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            "should_run=true\n" +
            "gold_should_run=" + String(goldShouldRun) + "\n" +
            "btc_should_run=" + String(btcShouldRun) + "\n");
          NODE

      - name: Run authenticated analysis for enabled markets
        if: steps.preflight.outputs.should_run == 'true'
        env:
          GOLD_SCALPER_URL: https://gold-scalper-nexora-apparel.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GOLD_SHOULD_RUN: ${{ steps.preflight.outputs.gold_should_run }}
          BTC_SHOULD_RUN: ${{ steps.preflight.outputs.btc_should_run }}
        run: |
          set -eu
          run_market() {
            api_path="$1"
            symbol="$2"
            response_file="$(mktemp)"
            code="$(curl --silent --show-error --connect-timeout 8 --max-time 90 \
              --output "$response_file" --write-out '%{http_code}' \
              --request POST "${GOLD_SCALPER_URL%/}${api_path}" \
              --header "Authorization: Bearer $CRON_SECRET" \
              --header "Content-Type: application/json" \
              --data '{}')"
            echo "$symbol analysis endpoint HTTP status: $code"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "$symbol analysis failed; response (secrets are not included):"
              cat "$response_file"
              rm -f "$response_file"
              return 1
            fi
            node --input-type=module - "$response_file" "$symbol" <<'NODE'
            import fs from "node:fs";
            const file = process.argv[2];
            const symbol = process.argv[3];
            let body;
            try {
              body = JSON.parse(fs.readFileSync(file, "utf8"));
            } catch {
              console.error(symbol + " analysis returned invalid JSON.");
              process.exit(1);
            }
            const summary = {
              symbol,
              status: body.status ?? "UNKNOWN",
              marketDataVerified: body.marketDataVerified === true,
              latestCompletedCandle: body.latestCompletedCandle ?? null,
              entryMonitoring: body.entryMonitoring?.state ?? null,
              checkedAt: body.checkedAt ?? null,
              reason: body.reason ?? null,
              error: body.error ?? null
            };
            console.log(JSON.stringify(summary));
            if (body.marketDataVerified !== true) {
              console.error(symbol + " analysis did not verify fresh completed candles.");
              process.exit(1);
            }
            NODE
            result=$?
            rm -f "$response_file"
            return "$result"
          }
          if [ "$GOLD_SHOULD_RUN" = "true" ]; then
            run_market "/api/analyze" "XAUUSD"
          fi
          if [ "$BTC_SHOULD_RUN" = "true" ]; then
            run_market "/api/analyze-btc" "BTCUSD"
          fi
